<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesso seguro à administração da campanha Cloudy Impact.">
  <meta name="robots" content="noindex,nofollow">
  <title>Acesso administrativo | Cloudy Impact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand brand--center" href="/" aria-label="Página inicial da campanha Cloudy Impact">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span>Cloudy <strong>Impact</strong></span>
    </a>

    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M12 14v3"/></svg>
      </div>
      <p class="eyebrow">Administração da campanha</p>
      <h1 id="auth-title">Acesso administrativo</h1>
      <p class="auth-lead" id="auth-lead">Entre para gerenciar a campanha da Jessica.</p>

      <div class="local-notice" role="note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.7 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/></svg>
        <span><strong>Acesso seguro de produção.</strong> A autenticação e os dados da campanha são protegidos pelo Supabase Auth e por políticas de segurança no banco.</span>
      </div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="admin-email">E-mail</label>
          <input id="admin-email" name="email" type="email" autocomplete="username" placeholder="voce@exemplo.com" required>
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="field">
          <label for="admin-password">Senha</label>
          <div class="password-field">
            <input id="admin-password" name="password" type="password" autocomplete="current-password" minlength="10" placeholder="No mínimo 10 caracteres" required>
            <button class="icon-button" id="toggle-password" type="button" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>
        <p class="form-message" id="auth-message" role="alert" hidden></p>
        <button class="primary-button primary-button--full" id="auth-submit" type="submit">Entrar</button>
      </form>
    </section>

    <a class="back-link" href="/">← Voltar para a campanha</a>
  </main>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/admin-auth.js"></script>
</body>
</html>
